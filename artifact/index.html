<title>VILLA DE GD Sting</title>
<style>
  /* Machine shop, lights down: graphite ground, nickel type, one 16:9 window.
     Single-theme on purpose — the piece is a grey studio render, and a light
     chrome around it would fight the thing it frames. */
  :root {
    --ink: #e7eaee;
    --ink-dim: #8b919a;
    --ink-faint: #555b63;
    --ground: #0b0c0e;
    --panel: #15171a;
    --line: #272b31;
    --nickel: #c4c8ce;
    color-scheme: dark;
    --font-display: 'Cinzel', "Liberation Serif", Georgia, serif;
    --font-ui: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  }
  @font-face {
    font-family: 'Cinzel';
    src: url('assets/fonts/cinzel-latin.woff2') format('woff2');
    font-weight: 400 900;
    font-display: swap;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%;
    margin: 0;
    padding-block: clamp(18px, 4vh, 40px);
    padding-inline: 16px;
    background: var(--ground);
    color: var(--ink);
    font: 400 14px/1.55 var(--font-ui);
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 3vh, 28px);
    justify-content: center;
  }

  .wrap { width: min(100%, 1180px); margin-inline: auto; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .mark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(15px, 2.4vw, 20px);
    letter-spacing: 0.3em;
    color: var(--nickel);
    margin: 0;
    text-wrap: balance;
  }
  .spec {
    display: flex;
    gap: clamp(10px, 2vw, 18px);
    flex-wrap: wrap;
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  .stage {
    position: relative;
    aspect-ratio: 16 / 9;
    max-width: 100%;
    background: #000;
    border: 1px solid var(--line);
    overflow: hidden;
    cursor: pointer;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    transition: opacity .4s ease;
  }
  body.is-ready .loading { opacity: 0; pointer-events: none; }

  .track { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #1b1d21; }
  .track span { display: block; height: 100%; background: var(--nickel); transform: scaleX(0); transform-origin: left; }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 11px 22px;
    cursor: pointer;
    transition: border-color .2s ease, background .2s ease;
  }
  button:hover { border-color: #3c424a; background: #1b1e22; }
  button:focus-visible { outline: 2px solid var(--nickel); outline-offset: 2px; }

  .beats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px;
    margin: 0;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .beats div { background: var(--panel); padding: 13px 15px; min-width: 0; }
  .beats dt {
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    margin-bottom: 3px;
  }
  .beats dd { margin: 0; font-size: 13px; color: var(--ink-dim); }
  .hint { margin: 0; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>

<header class="wrap">
  <h1 class="mark">VILLA DE GD</h1>
  <p class="spec">
    <span>Logo sting</span><span>2.00s</span><span>16:9</span><span>60 fps</span><span>Three.js</span>
  </p>
</header>

<div class="stage wrap">
  <canvas id="view"></canvas>
  <div class="loading">Striking the die…</div>
  <div class="track"><span id="bar"></span></div>
</div>

<footer class="wrap">
  <button id="replay" type="button">Replay</button>
  <p class="hint">Click the frame or press space</p>
</footer>

<dl class="beats wrap">
  <div><dt>0.00 – 0.30s</dt><dd>Badge lands, struck flash</dd></div>
  <div><dt>0.00 – 1.18s</dt><dd>1.9 turns, hard decel</dd></div>
  <div><dt>1.18 – 1.35s</dt><dd>Settles with a small rock</dd></div>
  <div><dt>1.21 – 1.80s</dt><dd>Light sweeps the face</dd></div>
</dl>

<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./src/sting.js"></script>
